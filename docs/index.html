<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trip.com 가격 모니터</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

  <style>
    body {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 16px 48px;
      color: #172033;
      background: #f5f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin: 20px 0;
    }

    .card,
    section {
      border: 1px solid #dde3ee;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgb(15 23 42 / 4%);
    }

    .card {
      padding: 16px;
    }

    .label {
      color: #667085;
      font-size: 13px;
    }

    .value {
      margin-top: 8px;
      font-size: 23px;
      font-weight: 700;
    }

    section {
      margin-top: 20px;
      padding: 18px;
    }

    canvas {
      max-height: 360px;
    }

    .description {
      color: #667085;
      line-height: 1.6;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      white-space: nowrap;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #e8edf5;
      text-align: right;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    .error-row {
      color: #b42318;
    }

    #errorBox {
      display: none;
      margin-top: 16px;
      padding: 14px;
      color: #b42318;
      border: 1px solid #fecdca;
      border-radius: 10px;
      background: #fef3f2;
    }
  </style>
</head>

<body>
  <main>
    <h1>Trip.com 가격 모니터</h1>
<p class="description">
      가격은 자동 수집 시점의 Trip.com 표시값입니다.
      환율은 참고용 기준환율입니다.
    </p>

    <div id="errorBox"></div>
<div class="cards">
      <div class="card">
        <div class="label">최근 표시 가격</div>
<div class="value" id="latestPrice">아직 정상 수집 기록 없음</div>
</div>

      <div class="card">
        <div class="label">알림 기준</div>
<div class="value" id="thresholdPrice">850,000원</div>
</div>

      <div class="card">
        <div class="label">최근 KRW / 100 JPY</div>
<div class="value" id="latestJpy">—</div>
</div>

      <div class="card">
        <div class="label">최근 KRW / 1 USD</div>
<div class="value" id="latestUsd">—</div>
</div>
    </div>
<section>
      <h2>표시 가격 추이</h2>
<canvas id="priceChart"></canvas>
    </section>

    <section>
      <h2>환율 추이</h2>
<p id="fxInfo" class="description">
        아직 수집된 환율 데이터가 없습니다.
      </p>
      <canvas id="fxChart"></canvas>
    </section>

    <section>
      <h2>수집 이력</h2>
<div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>한국 시각</th>
              <th>표시 가격</th>
              <th>KRW / 100 JPY</th>
              <th>KRW / 1 USD</th>
              <th>환율 기준일</th>
              <th>상태</th>
            </tr>
          </thead>

          <tbody id="historyRows"></tbody>
        </table>
      </div>
</section>
  </main>

  <script>
    const element = (id) => document.getElementById(id);

    const money = new Intl.NumberFormat("ko-KR");

    const decimal = new Intl.NumberFormat("ko-KR", {
      maximumFractionDigits: 2
    });

    function isNumber(value) {
      return typeof value === "number" &&
        Number.isFinite(value);
    }

    function formatKrw(value) {
      return isNumber(value)
        ? `${money.format(value)}원`
        : "—";
    }

    function formatRate(value) {
      return isNumber(value)
        ? decimal.format(value)
        : "—";
    }

    function formatKst(value) {
      if (!value) {
        return "—";
      }

      return new Intl.DateTimeFormat("ko-KR", {
        dateStyle: "short",
        timeStyle: "short",
        timeZone: "Asia/Seoul"
      }).format(new Date(value));
    }

    function renderTable(records) {
      const tbody = element("historyRows");

      tbody.replaceChildren();

      if (records.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");

        td.colSpan = 6;
        td.textContent = "아직 수집 이력이 없습니다.";

        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
      }

      for (const record of [...records].reverse()) {
        const tr = document.createElement("tr");

        if (record.status !== "ok") {
          tr.classList.add("error-row");
        }

        const statusText =
          record.status === "ok"
            ? (
              record.alertStatus === "sent"
                ? "정상 · 알림 발송"
                : record.alertStatus === "disabled"
                  ? "정상 · 알림 비활성"
                  : "정상"
            )
            : "수집 실패";

        const cells = [
          formatKst(record.checkedAt),

          record.status === "ok"
            ? formatKrw(record.priceKrw)
            : "—",

          isNumber(record.krwPer100Jpy)
            ? `${formatRate(record.krwPer100Jpy)}원`
            : "—",

          isNumber(record.usdKrwPer1)
            ? `${formatRate(record.usdKrwPer1)}원`
            : "—",

          record.fxAsOf ?? "—",

          statusText
        ];

        for (const cellText of cells) {
          const td = document.createElement("td");
          td.textContent = cellText;
          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      }
    }

    function drawPriceChart(rows) {
      if (!window.Chart || rows.length === 0) {
        return;
      }

      const canvas = element("priceChart");

      Chart.getChart(canvas)?.destroy();

      new Chart(canvas, {
        type: "line",
        data: {
          labels: rows.map((row) => formatKst(row.checkedAt)),
          datasets: [
            {
              label: "표시 가격",
              data: rows.map((row) => row.priceKrw),
              borderColor: "#2563eb",
              backgroundColor: "#2563eb",
              tension: 0.2,
              pointRadius: 3
            },
            {
              label: "알림 기준",
              data: rows.map((row) => row.thresholdKrw),
              borderColor: "#dc2626",
              borderDash: [6, 6],
              pointRadius: 0,
              tension: 0
            }
          ]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              ticks: {
                callback: (value) =>
                  `${money.format(value)}원`
              }
            }
          }
        }
      });
    }

    function drawFxChart(rows) {
      if (!window.Chart || rows.length === 0) {
        return;
      }

      const canvas = element("fxChart");

      Chart.getChart(canvas)?.destroy();

      new Chart(canvas, {
        type: "line",
        data: {
          labels: rows.map((row) => formatKst(row.checkedAt)),
          datasets: [
            {
              label: "KRW / 100 JPY",
              data: rows.map((row) => row.krwPer100Jpy),
              borderColor: "#16a34a",
              yAxisID: "jpy",
              tension: 0.2
            },
            {
              label: "KRW / 1 USD",
              data: rows.map((row) => row.usdKrwPer1),
              borderColor: "#ea580c",
              yAxisID: "usd",
              tension: 0.2
            }
          ]
        },
        options: {
          responsive: true,
          scales: {
            jpy: {
              type: "linear",
              position: "left"
            },
            usd: {
              type: "linear",
              position: "right",
              grid: {
                drawOnChartArea: false
              }
            }
          }
        }
      });
    }

    async function init() {
      const response = await fetch(
        `./history.json?ts=${Date.now()}`,
        {
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error(
          "가격 이력 파일을 불러오지 못했습니다."
        );
      }

      const records = await response.json();

      if (!Array.isArray(records)) {
        throw new Error(
          "history.json 형식이 올바르지 않습니다."
        );
      }

      const successfulRows = records.filter(
        (record) =>
          record.status === "ok" &&
          isNumber(record.priceKrw)
      );

      const fxRows = successfulRows.filter(
        (record) =>
          isNumber(record.krwPer100Jpy) &&
          isNumber(record.usdKrwPer1)
      );

      const latestRecord = successfulRows.at(-1);
      const latestFx = fxRows.at(-1);
      const latestAnyRecord = records.at(-1);

      element("thresholdPrice").textContent = formatKrw(
        latestAnyRecord?.thresholdKrw ?? 850000
      );

      if (latestRecord) {
        element("latestPrice").textContent = formatKrw(
          latestRecord.priceKrw
        );
      }

      if (latestFx) {
        element("latestJpy").textContent =
          `${formatRate(latestFx.krwPer100Jpy)}원`;

        element("latestUsd").textContent =
          `${formatRate(latestFx.usdKrwPer1)}원`;

        element("fxInfo").textContent =
          `환율 기준일: ${latestFx.fxAsOf ?? "알 수 없음"} · ${latestFx.fxSource ?? "참조환율"}`;
      }

      renderTable(records);
      drawPriceChart(successfulRows);
      drawFxChart(fxRows);
    }

    init().catch((error) => {
      const errorBox = element("errorBox");

      errorBox.style.display = "block";
      errorBox.textContent =
        `대시보드를 표시하지 못했습니다: ${error.message}`;
    });
  </script>
</body>
</html>
