<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trip.com 가격 모니터</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

  <style>
    body {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 16px 48px;
      color: #172033;
      background: #f5f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    h1, h2 {
      margin-top: 0;
    }

    .description {
      color: #667085;
      line-height: 1.6;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin: 20px 0;
    }

    .card,
    section {
      border: 1px solid #dde3ee;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgb(15 23 42 / 4%);
    }

    .card {
      padding: 16px;
    }

    .label {
      color: #667085;
      font-size: 13px;
    }

    .value {
      margin-top: 8px;
      font-size: 23px;
      font-weight: 700;
    }

    section {
      margin-top: 20px;
      padding: 18px;
    }

    canvas {
      max-height: 360px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      white-space: nowrap;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #e8edf5;
      text-align: right;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    .error-row {
      color: #b42318;
    }

    #errorBox {
      display: none;
      margin-top: 16px;
      padding: 14px;
      color: #b42318;
      border: 1px solid #fecdca;
      border-radius: 10px;
      background: #fef3f2;
    }
  </style>
</head>

<body>
  <main>
    <h1>Trip.com 가격 모니터</h1>
<p class="description">
      가격은 자동 수집 시점의 Trip.com 표시값입니다.
      환율은 참고용 기준환율이며 실제 카드·현찰 환율과 다를 수 있습니다.
    </p>

    <div id="errorBox"></div>
<div class="cards">
      <div class="card">
        <div class="label">최근 표시 가격</div>
<div class="value" id="latestPrice">
          아직 정상 수집 기록 없음
        </div>
</div>

      <div class="card">
        <div class="label">알림 기준</div>
<div class="value" id="thresholdPrice">
          850,000원
        </div>
</div>

      <div class="card">
        <div class="label">최근 KRW / 100 JPY</div>
<div class="value" id="latestJpy">—</div>
</div>

      <div class="card">
        <div class="label">최근 KRW / 1 USD</div>
<div class="value" id="latestUsd">—</div>
</div>
    </div>
<section>
      <h2>표시 가격 추이</h2>
<canvas id="priceChart"></canvas>
    </section>

    <section>
      <h2>환율 추이</h2>
<p id="fxInfo" class="description">
        아직 수집된 환율 데이터가 없습니다.
      </p>
      <canvas id="fxChart"></canvas>
    </section>

    <section>
      <h2>수집 이력</h2>
<div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>한국 시각</th>
              <th>표시 가격</th>
              <th>KRW / 100 JPY</th>
              <th>KRW / 1 USD</th>
              <th>환율 기준일</th>
              <th>상태</th>
            </tr>
          </thead>

          <tbody id="historyRows"></tbody>
        </table>
      </div>
</section>
  </main>

  <script>
    const getElement = (id) =>
      document.getElementById(id);

    const moneyFormatter = new Intl.NumberFormat("ko-KR");

    const decimalFormatter = new Intl.NumberFormat("ko-KR", {
      maximumFractionDigits: 2
    });

    function isNumber(value) {
      return typeof value === "number" &&
        Number.isFinite(value);
    }

    function formatKrw(value) {
      return isNumber(value)
        ? `${moneyFormatter.format(value)}원`
        : "—";
    }

    function formatRate(value) {
      return isNumber(value)
        ? decimalFormatter.format(value)
        : "—";
    }

    function formatKst(isoDate) {
      return new Intl.DateTimeFormat("ko-KR", {
        dateStyle: "short",
        timeStyle: "short",
        timeZone: "Asia/Seoul"
      }).format(new Date(isoDate));
    }

    function addCell(tableRow, text) {
      const cell = document.createElement("td");
      cell.textContent = text;
      tableRow.appendChild(cell);
    }

    function renderTable(allRecords) {
      const tbody = getElement("historyRows");

      tbody.replaceChildren();

      if (allRecords.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 6;
        cell.textContent = "아직 수집 이력이 없습니다.";

        row.appendChild(cell);
        tbody.appendChild(row);
        return;
      }

      [...allRecords]
        .reverse()
        .forEach((record) => {
          const row = document.createElement("tr");

          if (record.status !== "ok") {
            row.classList.add("error-row");
          }

          addCell(row, formatKst(record.checkedAt));

          addCell(
            row,
            record.status === "ok"
              ? formatKrw(record.priceKrw)
              : "—"
          );

          addCell(
            row,
            isNumber(record.krwPer100Jpy)
              ? `${formatRate(record.krwPer100Jpy)}원`
              : "—"
          );

          addCell(
            row,
            isNumber(record.usdKrwPer1)
              ? `${formatRate(record.usdKrwPer1)}원`
              : "—"
          );

          addCell(row, record.fxAsOf ?? "—");

          let statusText = "수집 실패";

          if (record.status === "ok") {
            statusText = record.fxError
              ? "가격 정상 · 환율 실패"
              : "정상";

            if (record.alertStatus === "sent") {
              statusText += " · 알림 발송";
            }
          }

          addCell(row, statusText);

          tbody.appendChild(row);
        });
    }

    function renderPriceChart(priceRows) {
      if (
        !window.Chart ||
        priceRows.length === 0
      ) {
        return;
      }

      new Chart(getElement("priceChart"), {
        type: "line",
        data: {
          labels: priceRows.map((row) =>
            formatKst(row.checkedAt)
          ),
          datasets: [
            {
              label: "표시 가격",
              data: priceRows.map((row) =>
                row.priceKrw
              ),
              borderColor: "#2563eb",
              backgroundColor: "#2563eb",
              tension: 0.2,
              pointRadius: 3
            },
            {
              label: "알림 기준",
              data: priceRows.map((row) =>
                row.thresholdKrw
              ),
              borderColor: "#dc2626",
              borderDash: [6, 6],
              pointRadius: 0,
              tension: 0
            }
          ]
        },
        options: {
          responsive: true,
          interaction: {
            mode: "index",
            intersect: false
          },
          scales: {
            y: {
              ticks: {
                callback: (value) =>
                  `${moneyFormatter.format(value)}원`
              }
            }
          }
        }
      });
    }

    function renderFxChart(fxRows) {
      if (
        !window.Chart ||
        fxRows.length === 0
      ) {
        return;
      }

      new Chart(getElement("fxChart"), {
        type: "line",
        data: {
          labels: fxRows.map((row) =>
            formatKst(row.checkedAt)
          ),
          datasets: [
            {
              label: "KRW / 100 JPY",
              data: fxRows.map((row) =>
                row.krwPer100Jpy
              ),
              borderColor: "#16a34a",
              backgroundColor: "#16a34a",
              yAxisID: "yJpy",
              tension: 0.2,
              pointRadius: 3
            },
            {
              label: "KRW / 1 USD",
              data: fxRows.map((row) =>
                row.usdKrwPer1
              ),
              borderColor: "#ea580c",
              backgroundColor: "#ea580c",
              yAxisID: "yUsd",
              tension: 0.2,
              pointRadius: 3
            }
          ]
        },
        options: {
          responsive: true,
          interaction: {
            mode: "index",
            intersect: false
          },
          scales: {
            yJpy: {
              type: "linear",
              position: "left",
              title: {
                display: true,
                text: "KRW / 100 JPY"
              }
            },
            yUsd: {
              type: "linear",
              position: "right",
              title: {
                display: true,
                text: "KRW / 1 USD"
              },
              grid: {
                drawOnChartArea: false
              }
            }
          }
        }
      });
    }

    async function init() {
      const response = await fetch(
        `./history.json?time=${Date.now()}`,
        {
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error(
          "가격 이력 파일을 불러오지 못했습니다."
        );
      }

      const allRecords = await response.json();

      if (!Array.isArray(allRecords)) {
        throw new Error(
          "history.json 형식이 올바르지 않습니다."
        );
      }

      const priceRows = allRecords.filter(
        (row) =>
          row.status === "ok" &&
          isNumber(row.priceKrw)
      );

      const fxRows = priceRows.filter(
        (row) =>
          isNumber(row.krwPer100Jpy) &&
          isNumber(row.usdKrwPer1)
      );

      const latestPrice =
        priceRows[priceRows.length - 1];

      const latestFx =
        fxRows[fxRows.length - 1];

      if (latestPrice) {
        getElement("latestPrice").textContent =
          formatKrw(latestPrice.priceKrw);

        getElement("thresholdPrice").textContent =
          formatKrw(latestPrice.thresholdKrw);
      }

      if (latestFx) {
        getElement("latestJpy").textContent =
          `${formatRate(latestFx.krwPer100Jpy)}원`;

        getElement("latestUsd").textContent =
          `${formatRate(latestFx.usdKrwPer1)}원`;

        getElement("fxInfo").textContent =
          `환율 기준일: ${latestFx.fxAsOf ?? "알 수 없음"} · ${latestFx.fxSource ?? "참조환율"}`;
      }

      renderTable(allRecords);
      renderPriceChart(priceRows);
      renderFxChart(fxRows);
    }

    init().catch((error) => {
      const errorBox = getElement("errorBox");

      errorBox.style.display = "block";
      errorBox.textContent =
        `대시보드를 표시하지 못했습니다: ${error.message}`;
    });
  </script>
</body>
</html>
