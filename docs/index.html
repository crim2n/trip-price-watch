<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trip.com 가격 모니터</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

  <style>
    body {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 16px 48px;
      color: #172033;
      background: #f5f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    h1, h2 {
      margin-top: 0;
    }

    .description {
      color: #667085;
      line-height: 1.6;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin: 20px 0;
    }

    .card, section {
      border: 1px solid #dde3ee;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgb(15 23 42 / 4%);
    }

    .card {
      padding: 16px;
    }

    .label {
      color: #667085;
      font-size: 13px;
    }

    .value {
      margin-top: 8px;
      font-size: 23px;
      font-weight: 700;
    }

    section {
      margin-top: 20px;
      padding: 18px;
    }

    canvas {
      max-height: 360px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      white-space: nowrap;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #e8edf5;
      text-align: right;
    }

    th:first-child, td:first-child {
      text-align: left;
    }

    #error {
      display: none;
      margin-top: 16px;
      padding: 14px;
      color: #b42318;
      border: 1px solid #fecdca;
      border-radius: 10px;
      background: #fef3f2;
    }
  </style>
</head>

<body>
  <h1 id="title">Trip.com 가격 모니터</h1>
<p class="description">
    가격은 자동 수집 시점의 Trip.com 표시값입니다.
    환율은 참고용 기준환율이며 실제 카드·현찰 환율과 다를 수 있습니다.
  </p>

  <div id="error"></div>
<div class="cards">
    <div class="card">
      <div class="label">최근 표시 가격</div>
<div class="value" id="latestPrice">—</div>
</div>

    <div class="card">
      <div class="label">알림 기준</div>
<div class="value" id="threshold">—</div>
</div>

    <div class="card">
      <div class="label">최근 KRW / 100 JPY</div>
<div class="value" id="latestJpy">—</div>
</div>

    <div class="card">
      <div class="label">최근 KRW / 1 USD</div>
<div class="value" id="latestUsd">—</div>
</div>
  </div>
<section>
    <h2>표시 가격 추이</h2>
<canvas id="priceChart"></canvas>
  </section>

  <section>
    <h2>환율 추이</h2>
<p class="description" id="fxInfo"></p>
    <canvas id="fxChart"></canvas>
  </section>

  <section>
    <h2>수집 이력</h2>
<div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>한국 시각</th>
            <th>표시 가격</th>
            <th>KRW / 100 JPY</th>
            <th>KRW / 1 USD</th>
            <th>환율 기준일</th>
            <th>상태</th>
          </tr>
        </thead>
        <tbody id="historyRows"></tbody>
      </table>
    </div>
</section>

  <script>
    const $ = (id) => document.getElementById(id);

    const money = new Intl.NumberFormat("ko-KR");

    const decimal = new Intl.NumberFormat("ko-KR", {
      maximumFractionDigits: 2
    });

    function isNumber(value) {
      return typeof value === "number" &&
        Number.isFinite(value);
    }

    function formatKrw(value) {
      return isNumber(value)
        ? `${money.format(value)}원`
        : "—";
    }

    function formatRate(value) {
      return isNumber(value)
        ? decimal.format(value)
        : "—";
    }

    function formatKst(value) {
      return new Intl.DateTimeFormat("ko-KR", {
        dateStyle: "short",
        timeStyle: "short",
        timeZone: "Asia/Seoul"
      }).format(new Date(value));
    }

    function addCell(row, text) {
      const cell = document.createElement("td");
      cell.textContent = text;
      row.appendChild(cell);
    }

    function drawPriceChart(rows) {
      if (!rows.length || typeof Chart === "undefined") {
        return;
      }

      new Chart($("priceChart"), {
        type: "line",
        data: {
          labels: rows.map((row) => formatKst(row.checkedAt)),
          datasets: [
            {
              label: "표시 가격",
              data: rows.map((row) => row.priceKrw),
              borderColor: "#2563eb",
              backgroundColor: "#2563eb",
              tension: 0.2,
              pointRadius: 3
            },
            {
              label: "알림 기준",
              data: rows.map((row) => row.thresholdKrw),
              borderColor: "#dc2626",
              borderDash: [6, 6],
              pointRadius: 0,
              tension: 0
            }
          ]
        },
        options: {
          responsive: true,
          interaction: {
            mode: "index",
            intersect: false
          },
          scales: {
            y: {
              ticks: {
                callback: (value) =>
                  `${money.format(value)}원`
              }
            }
          }
        }
      });
    }

    function drawFxChart(rows) {
      if (!rows.length || typeof Chart === "undefined") {
        return;
      }

      new Chart($("fxChart"), {
        type: "line",
        data: {
          labels: rows.map((row) => formatKst(row.checkedAt)),
          datasets: [
            {
              label: "KRW / 100 JPY",
              data: rows.map((row) => row.krwPer100Jpy),
              borderColor: "#16a34a",
              backgroundColor: "#16a34a",
              yAxisID: "yJpy",
              tension: 0.2,
              pointRadius: 3
            },
            {
              label: "KRW / 1 USD",
              data: rows.map((row) => row.usdKrwPer1),
              borderColor: "#ea580c",
              backgroundColor: "#ea580c",
              yAxisID: "yUsd",
              tension: 0.2,
              pointRadius: 3
            }
          ]
        },
        options: {
          responsive: true,
          interaction: {
            mode: "index",
            intersect: false
          },
          scales: {
            yJpy: {
              type: "linear",
              position: "left",
              title: {
                display: true,
                text: "KRW / 100 JPY"
              }
            },
            yUsd: {
              type: "linear",
              position: "right",
              title: {
                display: true,
                text: "KRW / 1 USD"
              },
              grid: {
                drawOnChartArea: false
              }
            }
          }
        }
      });
    }

    function fillTable(allRows) {
      const fragment = document.createDocumentFragment();

      [...allRows]
        .reverse()
        .slice(0, 180)
        .forEach((row) => {
          const tr = document.createElement("tr");

          addCell(tr, formatKst(row.checkedAt));

          addCell(
            tr,
            row.status === "ok"
              ? formatKrw(row.priceKrw)
              : "—"
          );

          addCell(
            isNumber(row.krwPer100Jpy)
              ? `${formatRate(row.krwPer100Jpy)}원`
              : "—"
          );

          addCell(
            isNumber(row.usdKrwPer1)
              ? `${formatRate(row.usdKrwPer1)}원`
              : "—"
          );

          addCell(tr, row.fxAsOf ?? "—");

          const status = row.status !== "ok"
            ? "수집 실패"
            : row.fxError
              ? "가격 정상 · 환율 실패"
              : "정상";

          addCell(tr, status);

          fragment.appendChild(tr);
        });

      $("historyRows").replaceChildren(fragment);
    }

    async function init() {
      const response = await fetch(
        `./history.json?time=${Date.now()}`,
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error("가격 이력 파일을 불러오지 못했습니다.");
      }

      const allRows = await response.json();

      if (!Array.isArray(allRows)) {
        throw new Error("가격 이력 형식이 올바르지 않습니다.");
      }

      const priceRows = allRows.filter(
        (row) =>
          row.status === "ok" &&
          isNumber(row.priceKrw)
      );

      const fxRows = priceRows.filter(
        (row) =>
          isNumber(row.krwPer100Jpy) &&
          isNumber(row.usdKrwPer1)
      );

      const latestPrice = priceRows.at(-1);
      const latestFx = fxRows.at(-1);

      if (latestPrice?.label) {
        $("title").textContent = latestPrice.label;
      }

      $("latestPrice").textContent = latestPrice
        ? formatKrw(latestPrice.priceKrw)
        : "아직 수집 기록 없음";

      $("threshold").textContent = latestPrice
        ? formatKrw(latestPrice.thresholdKrw)
        : "—";

      $("latestJpy").textContent = latestFx
        ? `${formatRate(latestFx.krwPer100Jpy)}원`
        : "—";

      $("latestUsd").textContent = latestFx
        ? `${formatRate(latestFx.usdKrwPer1)}원`
        : "—";

      $("fxInfo").textContent = latestFx
        ? `환율 기준일: ${latestFx.fxAsOf ?? "알 수 없음"} · ${latestFx.fxSource ?? "참조환율"}`
        : "아직 수집된 환율 데이터가 없습니다.";

      drawPriceChart(priceRows);
      drawFxChart(fxRows);
      fillTable(allRows);
    }

    init().catch((error) => {
      $("error").style.display = "block";
      $("error").textContent =
        `대시보드를 표시하지 못했습니다: ${error.message}`;
    });
  </script>
</body>
</html>
